packages:
  - example
  - example-config
  - example-src-dir
  - example-sync
allowBuilds:
  esbuild: true

catalog:
  "@types/react": ^19.2.7
  react: ^19.2.4
  react-dom: ^19.2.4
  webpack: ^5.98.0
  webpack-cli: ^7.0.0
  webpack-dev-server: ^6.0.0
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
